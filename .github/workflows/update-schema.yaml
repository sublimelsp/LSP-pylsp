name: Check for updates in pylsp schema

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  check_schema:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Get version from PR
        id: version-to
        run: echo "VERSION=$(rg -o 'python-lsp-server\[all\]==([\d.]+)' -r v\$1 "server/pyproject.toml")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Get version from master
        id: version-from
        run: echo "VERSION=$(rg -o 'python-lsp-server\[all\]==([\d.]+)' -r v\$1 "server/pyproject.toml")" >> "$GITHUB_OUTPUT"

      # Other dependencies of the server don't change the settings.
      - name: Run schema_diff.sh script
        id: schema_diff
        if: steps.version-from.outputs.VERSION != steps.version-to.outputs.VERSION
        env:
          VERSION_FROM: ${{ steps.version-from.outputs.VERSION }}
          VERSION_TO: ${{ steps.version-to.outputs.VERSION }}
        run: |
          changes=$(./scripts/schema_diff.sh "$VERSION_FROM" "$VERSION_TO")
          {
            echo 'CHANGES<<SCHEMA_DIFF_EOF'
            echo "$changes"
            echo 'SCHEMA_DIFF_EOF'
          } >> "$GITHUB_OUTPUT"
          if [ "$changes" = 'No changes' ]; then echo 'CHANGED=false'; else echo 'CHANGED=true'; fi >> "$GITHUB_OUTPUT"

      - name: Find Comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        if: steps.schema_diff.outcome == 'success'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v5
        if: steps.schema_diff.outcome == 'success'
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Following are the [schema](https://github.com/python-lsp/python-lsp-server/blob/${{ steps.version-to.outputs.VERSION }}/pylsp/config/schema.json) changes between tags `${{ steps.version-from.outputs.VERSION }}` and `${{ steps.version-to.outputs.VERSION }}`. Make sure that those are reflected in `LSP-pylsp.sublime-settings` and `sublime-package.json` files.

            ```diff
            ${{ steps.schema_diff.outputs.CHANGES }}
            ```
          edit-mode: replace

      # So that Renovate doesn't automerge an update whose settings need review. Merge it by hand once the settings are
      # updated.
      - name: Fail if the schema changed
        if: steps.schema_diff.outputs.CHANGED == 'true'
        run: |
          echo "::error::The pylsp settings schema changed, see the PR comment."
          exit 1
